name: Deploy ECS Microservices

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: white-hart
  PRODUCT_ECR_REPO: apprepo
  PRODUCT_ECS_SERVICE: vetri
  PAYMENT_ECR_REPO: payrepo
  PAYMENT_ECS_SERVICE: vetripayment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve -input=false -no-color

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Product App Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$PRODUCT_ECR_REPO:latest ./catalog
          docker push $ECR_REGISTRY/$PRODUCT_ECR_REPO:latest

      - name: Build and Push Payment App Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$PAYMENT_ECR_REPO:latest ./payment
          docker push $ECR_REGISTRY/$PAYMENT_ECR_REPO:latest

      - name: Force New Deployment on Product ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PRODUCT_ECS_SERVICE }} \
            --force-new-deployment

      - name: Force New Deployment on Payment ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PAYMENT_ECS_SERVICE }} \
            --force-new-deployment
