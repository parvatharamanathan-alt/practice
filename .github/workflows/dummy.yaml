name: Destroy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to confirm tearing down all AWS resources'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: white-hart
  ECS_SERVICE: vetri

jobs:
  destroy:
    if: github.event.inputs.confirm_destroy == 'DESTROY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale down ECS service to 0 (prevents ENI/ALB hang)
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --desired-count 0 || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Sync manually deleted resources from Terraform state
        run: |
          terraform state rm aws_ecr_repository.practice || true
          terraform state rm aws_vpc_security_group_ingress_rule.inboundlb || true
          terraform state rm aws_vpc_security_group_egress_rule.outboundlb || true
          terraform state rm aws_security_group.securelb || true
          terraform state rm aws_security_group.ecssg || true

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -no-color
